[project]
name = "graduation"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "hydra-core>=1.3.2",
    "lkh>=1.1.1",
    "numpy>=2.4.6",
    "omegaconf>=2.3.0",
    "pandas>=3.0.3",
    "pyconcorde",
    "pydantic>=2.13.4",
    "pyvrp>=0.13.4",
    "scikit-learn>=1.8.0",
    "torch>=2.12.0",
    "tqdm>=4.67.3",
    "tsplib95>=0.7.1",
    "wandb>=0.27.0",
]

[dependency-groups]
dev = [
    "pytest>=8.4.0",
    "ruff>=0.15.14",
    "ty>=0.0.38",
]

[tool.uv.sources]
pyconcorde = { git = "https://github.com/jvkersch/pyconcorde" }

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["difusco"]
