# Override at the CLI for larger experiments, e.g.:
#   uv run python -m difusco.main.run_train training.epochs=30 model=paper

epochs: 15
lr: 2e-4 # paper uses 2e-4 with AdamW
weight_decay: 1e-4
dropout: 0.0
batch_size: 16 # constrained by M4 Pro memory; paper uses larger batches on A100
num_workers: 4

# Validation cadence. With epochs=15, eval_every=3 gives 6 val points
# (epochs 1, 3, 6, 9, 12, 15) — enough to draw a gap-vs-epoch curve.
eval_every: 3
log_interval: 100
train_val_split: 0.9
