defaults:
  - data: cvrp50
  - model: paper
  - diffusion: categorical
  - training: local
  - inference: default
  - _self_

wandb:
  project: difusco-cvrp
  mode: online
  run_name: null

data_path: ./data/cvrp50-50_128000_pyvrp.txt
# Run dirs: checkpoints/difusco_cvrp_YYYYMMDD_HHMMSS/
checkpoint_dir: ./checkpoints

# Validation decode: greedy heatmap edges + optional intra-route 2-opt (see inference group).
inference:
  use_2opt: true
  max_2opt_iterations: 100
