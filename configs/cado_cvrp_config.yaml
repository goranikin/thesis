defaults:
  - data: cvrp50
  - model: paper
  - diffusion: categorical
  - _self_

wandb:
  project: cado-cvrp
  mode: online
  run_name: null

data_path: ./data/cvrp50-50_128000_pyvrp.txt
checkpoint_dir: ./checkpoints
seed: 42

cado:
  # null = latest checkpoints/difusco_cvrp_*/best_model.pt
  pretrained_ckpt: null
  pretrained_tag: difusco_cvrp

  algorithm: reinforce
  reward_mode: LCR
  use_2opt_in_reward: false # set true to apply per-route 2-opt inside compute_reward

  lora_rank: 2
  selective_layers: 1

  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0

  M_train: 5
  M_eval: 25
  schedule_type: cosine

  epochs: 500
  samples_per_epoch: 128
  batch_size: 32

  ppo_inner_epochs: 4
  ppo_clip_epsilon: 0.2

  log_interval: 4
  eval_every: 10
  eval_subset: 100

# Saves to checkpoints/cado_cvrp_YYYYMMDD_HHMMSS/best_model.pt
#
# uv run python -m cado.cvrp.main.run_train \\
#     cado.pretrained_ckpt=checkpoints/difusco_cvrp_20260528_110854/best_model.pt \\
#     cado.epochs=200 \\
#     wandb.run_name=cado_cvrp_pilot
