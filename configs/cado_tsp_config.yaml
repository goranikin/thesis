defaults:
  - data: tsp50
  - model: paper
  - diffusion: categorical
  - _self_

wandb:
  project: cado-tsp
  mode: online
  run_name: null

data_path: ./data/tsp50_128000_concorde.txt
checkpoint_dir: ./checkpoints
seed: 42

cado:
  # null = latest checkpoints/difusco_tsp_*/best_model.pt
  pretrained_ckpt: null
  pretrained_tag: difusco_tsp

  algorithm: reinforce # one of: reinforce, ppo  (paper: reinforce)
  reward_mode: SR # one of: LCR, SR  (paper recommends LCR)
  use_2opt_in_reward: false

  lora_rank: 2
  selective_layers: 1

  lr: 1.0e-4 # paper value (Table 9)
  weight_decay: 0.0
  grad_clip: 1.0

  M_train: 5
  M_eval: 25
  schedule_type: cosine

  init_noise: bernoulli_half

  epochs: 500 # paper: 3000 (TSP-100);
  samples_per_epoch: 128
  batch_size: 32

  ppo_inner_epochs: 4
  ppo_clip_epsilon: 0.2

  log_interval: 4

  eval_every: 10
  eval_subset: 100
  eval_batch_size: 16

  save_best_only: true

# Saves to checkpoints/cado_tsp_YYYYMMDD_HHMMSS/best_model.pt
#
# uv run python -m cado.tsp.main.run_train \\
#     cado.pretrained_ckpt=checkpoints/difusco_tsp_20260524_234510/best_model.pt \\
#     cado.epochs=200 \\
#     wandb.run_name=cado_tsp_pilot
