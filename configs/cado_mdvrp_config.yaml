defaults:
  - data: mdvrp50
  - model: paper
  - diffusion: categorical
  - _self_

wandb:
  project: cado-mdvrp
  mode: online
  run_name: null

data_path: ./data/mdvrp50_pyvrp.txt
checkpoint_dir: ./checkpoints
seed: 42

cado:
  # null = latest checkpoints/difusco_mdvrp_*/best_model.pt
  pretrained_ckpt: null
  pretrained_tag: difusco_mdvrp

  algorithm: reinforce
  reward_mode: SR
  use_2opt_in_reward: false   # not applicable to assignment heatmap

  lora_rank: 2
  selective_layers: 1

  lr: 1.0e-4
  weight_decay: 0.0
  grad_clip: 1.0

  M_train: 5
  M_eval: 25
  schedule_type: cosine

  epochs: 500
  samples_per_epoch: 128
  batch_size: 32

  ppo_inner_epochs: 4
  ppo_clip_epsilon: 0.2

  log_interval: 4
  eval_every: 10
  eval_subset: 100

# Saves to checkpoints/cado_mdvrp_YYYYMMDD_HHMMSS/best_model.pt
#
# uv run python -m cado.mdvrp.main.run_train \\
#     cado.pretrained_ckpt=checkpoints/difusco_mdvrp_20260605_120000/best_model.pt \\
#     cado.epochs=200 \\
#     wandb.run_name=cado_mdvrp_pilot
